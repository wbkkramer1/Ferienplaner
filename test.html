<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa-Park Live-Auslastung</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --accent-blue: #3498db;
            --state-leer: #2ecc71;
            --state-maessig: #f1c40f;
            --state-voll: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .ort {
            color: #7f8c8d;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .auslastung-kreis {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 8px solid #eee;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 2rem auto;
            transition: all 0.5s ease;
        }

        .prozent {
            font-size: 3.5rem;
            font-weight: bold;
        }

        .status-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .update-zeit {
            font-size: 0.8rem;
            color: #95a5a6;
        }

        .button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Europa-Park</h1>
    <div class="ort">Rust, Deutschland</div>

    <div class="auslastung-kreis" id="kreis">
        <div class="prozent" id="wert">--</div>
    </div>

    <div class="status-text" id="status">Lade Live-Daten...</div>
    
    <button class="button" onclick="holeEuropaParkDaten()">Jetzt aktualisieren</button>
    <div class="update-zeit" id="zeit" style="margin-top: 1rem;"></div>
</div>

<script>
    async function holeEuropaParkDaten() {
        const wertAnzeige = document.getElementById('wert');
        const statusAnzeige = document.getElementById('status');
        const kreis = document.getElementById('kreis');
        const zeitAnzeige = document.getElementById('zeit');
        
        wertAnzeige.innerText = "⏳";
        statusAnzeige.innerText = "Verbindung wird aufgebaut...";
        
        // Die ID 51 ist der Europa-Park auf der CORS-freien Schnittstelle
        const url = 'https://queue-times.com/parks/51/queue_times.json';
        
        try {
            // Direkter fetch ohne Proxy, da queue-times CORS für Browser erlaubt!
            const response = await fetch(url);
            if (!response.ok) throw new Error('API antwortet nicht');
            
            const data = await response.json();
            
            // Wir berechnen die durchschnittliche Wartezeit aller geöffneten Attraktionen
            if (data && data.rides) {
                const geoeffneteAttraktionen = data.rides.filter(r => r.is_open === true);
                
                if (geoeffneteAttraktionen.length > 0) {
                    const gesamtWartezeit = geoeffneteAttraktionen.reduce((sum, r) => sum + r.wait_time, 0);
                    const durchschnitt = gesamtWartezeit / geoeffneteAttraktionen.length;
                    
                    // Wir rechnen die Minuten in einen Prozentwert für deinen Kreis um (max 90 Min = 100%)
                    let prozentwert = Math.round((durchschnitt / 90) * 100);
                    if (prozentwert > 100) prozentwert = 100;
                    if (prozentwert < 5) prozentwert = 12; // Basisrauschen

                    wertAnzeige.innerHTML = `${prozentwert}<span style="font-size: 1.5rem;">%</span>`;
                    
                    if (prozentwert >= 60) {
                        statusAnzeige.innerText = "Sehr voll (Lange Wartezeiten)";
                        statusAnzeige.style.color = "var(--state-voll)";
                        kreis.style.borderColor = "var(--state-voll)";
                    } else if (prozentwert >= 30) {
                        statusAnzeige.innerText = "Mäßig besucht (Normalbetrieb)";
                        statusAnzeige.style.color = "var(--state-maessig)";
                        kreis.style.borderColor = "var(--state-maessig)";
                    } else {
                        statusAnzeige.innerText = "Sehr leer (Freie Fahrt!)";
                        statusAnzeige.style.color = "var(--state-leer)";
                        kreis.style.borderColor = "var(--state-leer)";
                    }
                    
                    const jetzt = new Date();
                    zeitAnzeige.innerText = `Zuletzt aktualisiert: ${jetzt.toLocaleTimeString('de-DE')} Uhr`;
                    return;
                }
            }
            throw new Error('Park aktuell geschlossen.');
            
        } catch (fehler) {
            console.error(fehler);
            wertAnzeige.innerText = "❌";
            statusAnzeige.innerText = "Park aktuell geschlossen oder offline.";
            statusAnzeige.style.color = "var(--state-voll)";
            kreis.style.borderColor = "#eee";
            zeitAnzeige.innerText = "Wartezeiten stehen erst wieder ab Parköffnung bereit.";
        }
    }

    document.addEventListener('DOMContentLoaded', holeEuropaParkDaten);
</script>

</body>
</html>
