<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferien-Finder 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <h1>Ferien-Finder 2026</h1>
    </header>

    <div class="dashboard-grid">
        
        <aside class="sidebar-panel">
            <section class="control-box">
                <h2 id="selected-date-display">27. Mai 2026</h2>
                
                <div class="form-group">
                    <label for="state-select">Fokus-Bundesland:</label>
                    <select id="state-select">
                        </select>
                </div>

                <div class="toggle-group">
                    <label class="switch">
                        <input type="checkbox" id="week-check">
                        <span class="slider round"></span>
                    </label>
                    <span class="toggle-label">Ganze Woche prüfen</span>
                </div>
            </section>

            <section class="calendar-wrapper" id="calendar-container">
                </section>
        </aside>

        <main class="map-panel">
            <header class="info-banner">
                <p id="info-box">Wähle ein Datum oder fahre über die Pins, um die Ferien-Prognose zu sehen.</p>
            </header>

            <div class="split-maps-container">
                <div class="map-box">
                    <h3>Schulstatus der Länder</h3>
                    <div class="map-graphic-wrapper">
                        <img src="https://raw.githubusercontent.com/wbkkramer1/ferienfinder/main/w9bO3_deutschland_landkreise_11_2011.png" alt="Deutschlandkarte Schulstatus" class="germany-svg">
                        
                        <div class="ferien-pin pin-sh" data-land="Schleswig-Holstein" style="top: 14%; left: 45%;"></div>
                        <div class="ferien-pin pin-hh" data-land="Hamburg" style="top: 21%; left: 44%;"></div>
                        <div class="ferien-pin pin-mv" data-land="Mecklenburg-Vorpommern" style="top: 19%; left: 68%;"></div>
                        <div class="ferien-pin pin-hb" data-land="Bremen" style="top: 27%; left: 32%;"></div>
                        <div class="ferien-pin pin-ni" data-land="Niedersachsen" style="top: 36%; left: 37%;"></div>
                        <div class="ferien-pin pin-bb" data-land="Brandenburg" style="top: 41%; left: 75%;"></div>
                        <div class="ferien-pin pin-be" data-land="Berlin" style="top: 40%; left: 78%;"></div>
                        <div class="ferien-pin pin-st" data-land="Sachsen-Anhalt" style="top: 48%; left: 56%;"></div>
                        <div class="ferien-pin pin-nw" data-land="Nordrhein-Westfalen" style="top: 53%; left: 23%;"></div>
                        <div class="ferien-pin pin-he" data-land="Hessen" style="top: 64%; left: 39%;"></div>
                        <div class="ferien-pin pin-th" data-land="Thüringen" style="top: 62%; left: 54%;"></div>
                        <div class="ferien-pin pin-sn" data-land="Sachsen" style="top: 57%; left: 72%;"></div>
                        <div class="ferien-pin pin-rp" data-land="Rheinland-Pfalz" style="top: 73%; left: 21%;"></div>
                        <div class="ferien-pin pin-sl" data-land="Saarland" style="top: 80%; left: 16%;"></div>
                        <div class="ferien-pin pin-bw" data-land="Baden-Württemberg" style="top: 86%; left: 38%;"></div>
                        <div class="ferien-pin pin-by" data-land="Bayern" style="top: 83%; left: 60%;"></div>
                    </div>
                </div>

                <div class="map-box">
                    <h3>Auslastung der Freizeitparks</h3>
                    <div class="map-graphic-wrapper">
                        <img src="https://raw.githubusercontent.com/wbkkramer1/ferienfinder/main/w9bO3_deutschland_landkreise_11_2011.png" alt="Deutschlandkarte Freizeitparks" class="germany-svg">
                        
                        <div class="park-pin" data-park="Hansa-Park" style="top: 17%; left: 50%;"></div>
                        <div class="park-pin" data-park="Karls Erlebnis-Dorf" style="top: 17%; left: 65%;"></div>
                        <div class="park-pin" data-park="Heide Park Resort" style="top: 31%; left: 42%;"></div>
                        <div class="park-pin" data-park="Serengeti-Park" style="top: 34%; left: 40%;"></div>
                        <div class="park-pin" data-park="Rasti-Land" style="top: 41%; left: 39%;"></div>
                        <div class="park-pin" data-park="Potts Park" style="top: 44%; left: 31%;"></div>
                        <div class="park-pin" data-park="Movie Park Germany" style="top: 48%; left: 19%;"></div>
                        <div class="park-pin" data-park="Phantasialand" style="top: 56%; left: 20%;"></div>
                        <div class="park-pin" data-park="Fort Fun Abenteuerland" style="top: 54%; left: 29%;"></div>
                        <div class="park-pin" data-park="Taunus Wunderland" style="top: 64%; left: 31%;"></div>
                        <div class="park-pin" data-park="Erlebnispark Tripsdrill" style="top: 81%; left: 38%;"></div>
                        <div class="park-pin" data-park="Schwaben Park" style="top: 82%; left: 42%;"></div>
                        <div class="park-pin" data-park="Europa-Park" style="top: 85%; left: 25%;"></div>
                        <div class="park-pin" data-park="Legoland Deutschland" style="top: 86%; left: 50%;"></div>
                        <div class="park-pin" data-park="Skyline Park" style="top: 89%; left: 53%;"></div>
                        <div class="park-pin" data-park="Bayern-Park" style="top: 82%; left: 67%;"></div>
                        <div class="park-pin" data-park="Freizeit-Land Geiselwind" style="top: 72%; left: 50%;"></div>
                        <div class="park-pin" data-park="Belantis" style="top: 54%; left: 63%;"></div>
                        <div class="park-pin" data-park="Freizeitpark Plohn" style="top: 62%; left: 66%;"></div>
                        <div class="park-pin" data-park="Plopsaland (Holiday Park)" style="top: 74%; left: 30%;"></div>
                        <div class="park-pin" data-park="Ravensburger Spieleland" style="top: 91%; left: 42%;"></div>
                        <div class="park-pin" data-park="Freizeitpark Lochmühle" style="top: 62%; left: 33%;"></div>
                        <div class="park-pin" data-park="Jaderpark" style="top: 25%; left: 34%;"></div>
                        <div class="park-pin" data-park="Tier- und Freizeitpark Thüle" style="top: 29%; left: 33%;"></div>
                        <div class="park-pin" data-park="Churpfalzkreis" style="top: 77%; left: 69%;"></div>
                        <div class="park-pin" data-park="Eifel-Park" style="top: 67%; left: 19%;"></div>
                        <div class="park-pin" data-park="Erlebnispark Steinau" style="top: 63%; left: 44%;"></div>
                        <div class="park-pin" data-park="Safariland Stukenbrock" style="top: 47%; left: 34%;"></div>
                    </div>
                </div>
            </div>
        </main>

        <section class="lists-panel">
            <div class="panel-box">
                <h3>Top Freizeitparks</h3>
                <div class="scroll-container" id="parks-liste">
                    </div>
            </div>

            <div class="panel-box" style="margin-top: 1.5rem;">
                <h3>Status nach Bundesland</h3>
                <div class="scroll-container" id="laender-liste">
                    </div>
            </div>
        </section>

    </div>

    <script src="daten.js"></script>
    <script src="script.js"></script>
</body>
</html>
